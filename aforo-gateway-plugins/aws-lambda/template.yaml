AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Aforo Usage Metering Lambda — processes API Gateway CloudWatch access logs
  and forwards usage events to Aforo's ingestor service. The stage's access-log
  format must include "customerId":"$context.authorizer.customerId" (see README).

Parameters:
  AforoEndpoint:
    Type: String
    Description: Aforo usage ingestor batch endpoint URL
    Default: https://api.aforo.ai/v1/ingest/batch
  AforoApiKey:
    Type: String
    Description: >-
      Aforo API key with scope usage:ingest. Sent as the X-API-Key header;
      the tenant is derived from the key (no tenant id is configured).
    NoEcho: true
  ApiGatewayLogGroupName:
    Type: String
    Description: CloudWatch log group for API Gateway access logs
    Default: /aws/apigateway/aforo-access-logs
  MetricMappings:
    Type: String
    Description: >-
      JSON array of endpoint-to-metric rules, first match wins, e.g.
      [{"matchType":"PREFIX","value":"/v1/sms","metricName":"sms_sent"}].
      matchType is EXACT, PREFIX or CONTAINS. Every metricName must be a
      metric registered in the Aforo catalog.
    Default: '[]'
  DefaultMetric:
    Type: String
    Description: >-
      Metric for requests no mapping matches. Must be registered in the Aforo
      catalog — an unknown metric fails the whole batch with 400.
    Default: api_calls
  MetricNamePattern:
    Type: String
    Description: >-
      Legacy route-shaped template ({method} {path} {service} {route}). Leave
      empty unless every resulting name is a catalog metric.
    Default: ''
  QuantitySource:
    Type: String
    Description: Quantity source (1 = count, response_size = bytes)
    Default: '1'
    AllowedValues: ['1', 'response_size']
  ProductType:
    Type: String
    Description: >-
      Aforo productType sent on every event (API, AGENTIC_API, AI_AGENT, ...).
      The ingestor requires it. MCP tools/call with both toolName and agentId
      is sent as MCP_SERVER instead. Events missing their type's required
      fields are skipped rather than sent.
    Default: API

Resources:
  AforoMeteringFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aforo-metering
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 256
      Description: Aforo usage metering - processes API Gateway access logs
      Environment:
        Variables:
          AFORO_ENDPOINT: !Ref AforoEndpoint
          AFORO_API_KEY: !Ref AforoApiKey
          METRIC_MAPPINGS: !Ref MetricMappings
          DEFAULT_METRIC: !Ref DefaultMetric
          METRIC_NAME_PATTERN: !Ref MetricNamePattern
          QUANTITY_SOURCE: !Ref QuantitySource
          PRODUCT_TYPE: !Ref ProductType
          FLUSH_COUNT: '50'
          INCLUDE_METADATA: 'true'
      # Async invocation (CloudWatch Logs): the handler throws when a batch
      # fails transiently so Lambda retries it; idempotency keys dedupe.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
      Tags:
        aforo-managed: 'true'
        purpose: metering

  AforoMeteringLogPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AforoMeteringFunction.Arn
      Action: lambda:InvokeFunction
      Principal: !Sub logs.${AWS::Region}.amazonaws.com
      SourceArn: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ApiGatewayLogGroupName}:*

  AforoMeteringSubscriptionFilter:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: AforoMeteringLogPermission
    Properties:
      LogGroupName: !Ref ApiGatewayLogGroupName
      FilterName: aforo-metering-filter
      FilterPattern: ''
      DestinationArn: !GetAtt AforoMeteringFunction.Arn

Outputs:
  FunctionArn:
    Description: ARN of the Aforo metering Lambda function
    Value: !GetAtt AforoMeteringFunction.Arn
  FunctionName:
    Description: Name of the Lambda function
    Value: !Ref AforoMeteringFunction
