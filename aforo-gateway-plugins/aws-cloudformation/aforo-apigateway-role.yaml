AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Aforo access to Amazon API Gateway. Creates one IAM role that Aforo's AWS account can
  assume only with this connection's external ID. The role reads API Gateway configuration
  (REST and HTTP APIs, stages, authorizers, usage plans) in one region; it cannot read API
  key values. With AllowMeteringInstall = true it can also install Aforo's metering Lambda
  (functions named aforo-metering-*), store the Aforo API key it uses in Secrets Manager
  (secrets named aforo/metering/*) and subscribe it to your API Gateway log groups; set it
  to false to keep the role read-only. With AllowGatewayOrchestration = true (default
  false) it can also manage API Gateway usage plans and API keys for Gateway Orchestration,
  read API Gateway CloudWatch metrics, and create Kinesis Data Firehose streams named
  aforo-gateway-* fed from your API Gateway log groups (push ingestion).

# Hosted publicly at the URL in aforo.aws.cfn-template-url (default
# https://aforo-templates.s3.amazonaws.com/aws-apigateway-role.yaml). CloudFormation only
# loads templates from S3, so a change here must be uploaded there to take effect.
# The launch URL built by AwsCloudFormationService fills in ExternalId (and AforoAccountId
# when aforo.aws.account-id is set), and opens the console in the connection's region, so
# the default ApiGatewayRegion (this stack's region) is the connection's region.
#
# The same file is published as aforo-gateway-plugins/aws-cloudformation/aforo-apigateway-role.yaml
# (and is organization-service src/main/resources/cloudformation/aws-apigateway-role.yaml).
# Change both together (3.2.0 has not been copied there yet).

Parameters:
  ExternalId:
    Type: String
    MinLength: 32
    MaxLength: 44
    AllowedPattern: '^[A-Za-z0-9-]+$'
    ConstraintDescription: 32 to 44 letters, digits or hyphens (Aforo generates a UUID).
    Description: The external ID Aforo generated for this connection. Leave it as it is.
  AforoAccountId:
    Type: String
    Default: '082424191442'
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be a 12-digit AWS account ID.
    Description: Aforo's AWS account ID. Leave it as it is.
  ApiGatewayRegion:
    Type: String
    Default: ''
    AllowedPattern: '^(\*|[a-z]{2}(-[a-z]+)+-\d+)?$'
    ConstraintDescription: Empty, * or a region code such as us-east-1.
    Description: >-
      Region Aforo may read API Gateway in and install the metering Lambda in. Empty means
      this stack's region. * means every region.
  AccessLogGroupPrefix:
    Type: String
    Default: ''
    AllowedPattern: '^[\w./#-]{0,500}$'
    Description: >-
      Only when your API access logs go to a log group whose name does not start with
      /aws/apigateway/ or API-Gateway-: that name, or a prefix of it. Aforo can subscribe
      the metering Lambda only to log groups matching these prefixes.
  AllowMeteringInstall:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      true lets Aforo's one-click metering create and remove a Lambda function named
      aforo-metering-*, the Secrets Manager secret aforo/metering/* holding its Aforo API
      key, and its CloudWatch Logs subscription in this account. false keeps the role
      read-only; you then install the metering Lambda yourself.
  AllowGatewayOrchestration:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Only for a connection that has no access keys. true lets Aforo's Gateway
      Orchestration create, update and delete API Gateway usage plans and API keys (and read
      the values of the keys it manages), read API Gateway CloudWatch metrics, and create a
      Kinesis Data Firehose stream named aforo-gateway-* with a subscription on your API
      Gateway log groups (push ingestion). false keeps none of these.
  FirehoseBackupBucketArn:
    Type: String
    Default: ''
    AllowedPattern: '^(arn:aws[a-z-]*:s3:::[a-z0-9][a-z0-9.-]{1,61}[a-z0-9])?$'
    ConstraintDescription: Empty or an S3 bucket ARN such as arn:aws:s3:::my-bucket.
    Description: >-
      Only with AllowGatewayOrchestration = true. An existing S3 bucket in this account for
      the records Firehose cannot deliver to Aforo. When set, the stack creates the two
      service roles push ingestion needs (Firehose writes this bucket; CloudWatch Logs puts
      records into aforo-gateway-* streams) and outputs their ARNs. Leave FirehoseRoleArn and
      CloudWatchLogsRoleArn empty when you set this.
  FirehoseRoleArn:
    Type: String
    Default: ''
    AllowedPattern: '^(arn:aws[a-z-]*:iam::\d{12}:role/[\w+=,.@/-]{1,512})?$'
    ConstraintDescription: Empty or an IAM role ARN.
    Description: >-
      Only with AllowGatewayOrchestration = true and your own roles: the role Kinesis Data
      Firehose assumes to write the backup bucket. Aforo may pass this role to Firehose only.
  CloudWatchLogsRoleArn:
    Type: String
    Default: ''
    AllowedPattern: '^(arn:aws[a-z-]*:iam::\d{12}:role/[\w+=,.@/-]{1,512})?$'
    ConstraintDescription: Empty or an IAM role ARN.
    Description: >-
      Only with AllowGatewayOrchestration = true and your own roles: the role CloudWatch Logs
      assumes to put records into the Firehose stream. Aforo may pass this role to CloudWatch
      Logs only.

Rules:
  CreatedOrOwnEventRoles:
    RuleCondition: !Not [!Equals [!Ref FirehoseBackupBucketArn, '']]
    Assertions:
      - Assert: !And
          - !Equals [!Ref FirehoseRoleArn, '']
          - !Equals [!Ref CloudWatchLogsRoleArn, '']
        AssertDescription: >-
          With FirehoseBackupBucketArn set the stack creates the Firehose and CloudWatch Logs
          roles; leave FirehoseRoleArn and CloudWatchLogsRoleArn empty.

Conditions:
  MeteringInstall: !Equals [!Ref AllowMeteringInstall, 'true']
  UseStackRegion: !Equals [!Ref ApiGatewayRegion, '']
  HasAccessLogGroupPrefix: !Not [!Equals [!Ref AccessLogGroupPrefix, '']]
  GatewayOrchestration: !Equals [!Ref AllowGatewayOrchestration, 'true']
  HasFirehoseBackupBucket: !Not [!Equals [!Ref FirehoseBackupBucketArn, '']]
  CreateEventRoles: !And [!Condition GatewayOrchestration, !Condition HasFirehoseBackupBucket]
  HasFirehoseRoleArn: !Not [!Equals [!Ref FirehoseRoleArn, '']]
  HasCloudWatchLogsRoleArn: !Not [!Equals [!Ref CloudWatchLogsRoleArn, '']]
  PassFirehoseRole: !And
    - !Condition GatewayOrchestration
    - !Or [!Condition HasFirehoseBackupBucket, !Condition HasFirehoseRoleArn]
  PassCloudWatchLogsRole: !And
    - !Condition GatewayOrchestration
    - !Or [!Condition HasFirehoseBackupBucket, !Condition HasCloudWatchLogsRoleArn]

Resources:
  AforoRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets Aforo read Amazon API Gateway configuration and, when allowed, install its metering Lambda.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AforoAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        # Read only what the import and capture code reads (AwsApiGatewayProductFetcher,
        # AwsApiGatewayAdapter): REST APIs, HTTP APIs (/apis) and usage plans, with their
        # stages, deployments, resources, routes and authorizers.
        - PolicyName: AforoApiGatewayReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadApiConfiguration
                Effect: Allow
                Action: apigateway:GET
                Resource:
                  - !Sub
                    - 'arn:${AWS::Partition}:apigateway:${Region}::/restapis'
                    - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                  - !Sub
                    - 'arn:${AWS::Partition}:apigateway:${Region}::/restapis/*'
                    - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                  - !Sub
                    - 'arn:${AWS::Partition}:apigateway:${Region}::/apis'
                    - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                  - !Sub
                    - 'arn:${AWS::Partition}:apigateway:${Region}::/apis/*'
                    - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                  - !Sub
                    - 'arn:${AWS::Partition}:apigateway:${Region}::/usageplans'
                    - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                  - !Sub
                    - 'arn:${AWS::Partition}:apigateway:${Region}::/usageplans/*'
                    - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
              # GET /apikeys?includeValues=true and GET /usageplans/{id}/keys return API
              # key values. Denied in every region, whatever else is attached to the role.
              # With AllowGatewayOrchestration = true, Gateway Orchestration reads the keys
              # it manages (GET /apikeys/{id}, GET /usageplans/{id}/keys), so those two are
              # no longer denied; listing every key (GET /apikeys) and GET
              # /usageplans/{id}/keys/{keyId} stay denied.
              - Sid: NeverReadApiKeys
                Effect: Deny
                Action: apigateway:GET
                Resource:
                  - !Sub 'arn:${AWS::Partition}:apigateway:*::/apikeys'
                  - !If
                    - GatewayOrchestration
                    - !Ref AWS::NoValue
                    - !Sub 'arn:${AWS::Partition}:apigateway:*::/apikeys/*'
                  - !If
                    - GatewayOrchestration
                    - !Ref AWS::NoValue
                    - !Sub 'arn:${AWS::Partition}:apigateway:*::/usageplans/*/keys'
                  - !Sub 'arn:${AWS::Partition}:apigateway:*::/usageplans/*/keys/*'
        # One-click metering install (AwsApiGatewayProvisioningAdapter). Everything is
        # limited to functions named aforo-metering-* and secrets named aforo/metering/*,
        # and the only role Aforo can hand to Lambda is the execution role below. Aforo
        # cannot create or change IAM roles, and cannot change API Gateway.
        - !If
          - MeteringInstall
          - PolicyName: AforoMeteringInstall
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: MeteringFunction
                  Effect: Allow
                  Action:
                    - lambda:CreateFunction
                    - lambda:GetFunction
                    - lambda:GetFunctionConfiguration
                    - lambda:UpdateFunctionCode
                    - lambda:UpdateFunctionConfiguration
                    - lambda:PutFunctionEventInvokeConfig
                    - lambda:AddPermission
                    - lambda:RemovePermission
                    - lambda:DeleteFunction
                    - lambda:TagResource
                  Resource: !Sub
                    - 'arn:${AWS::Partition}:lambda:${Region}:${AWS::AccountId}:function:aforo-metering-*'
                    - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                # The Aforo API key the function reads (AFORO_API_KEY_SECRET_ARN), so it is
                # never a Lambda environment variable. Aforo writes and deletes the secret;
                # it cannot read it back (no GetSecretValue). RestoreSecret undoes a removal
                # within its 7-day recovery window when metering is deployed again.
                - Sid: MeteringApiKeySecret
                  Effect: Allow
                  Action:
                    - secretsmanager:CreateSecret
                    - secretsmanager:PutSecretValue
                    - secretsmanager:DescribeSecret
                    - secretsmanager:DeleteSecret
                    - secretsmanager:RestoreSecret
                    - secretsmanager:TagResource
                  Resource: !Sub
                    - 'arn:${AWS::Partition}:secretsmanager:${Region}:${AWS::AccountId}:secret:aforo/metering/*'
                    - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                - Sid: PassMeteringExecutionRole
                  Effect: Allow
                  Action: iam:PassRole
                  Resource: !GetAtt AforoMeteringExecutionRole.Arn
                  Condition:
                    StringEquals:
                      iam:PassedToService: lambda.amazonaws.com
                # DescribeLogGroups has no resource-level permissions.
                - Sid: FindAccessLogGroup
                  Effect: Allow
                  Action: logs:DescribeLogGroups
                  Resource: '*'
                # Only API Gateway log groups. A subscription's destination is not an IAM
                # condition key; it is limited by what Aforo can grant: the role can add
                # an invoke permission only to aforo-metering-* functions, and can pass
                # no role to CloudWatch Logs (needed for Kinesis or Firehose destinations)
                # unless AllowGatewayOrchestration = true, which allows passing exactly one
                # role to CloudWatch Logs for aforo-gateway-* Firehose streams.
                - Sid: SubscribeToApiGatewayLogs
                  Effect: Allow
                  Action:
                    - logs:PutSubscriptionFilter
                    - logs:DeleteSubscriptionFilter
                    - logs:DescribeSubscriptionFilters
                  Resource:
                    - !Sub
                      - 'arn:${AWS::Partition}:logs:${Region}:${AWS::AccountId}:log-group:/aws/apigateway/*'
                      - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                    - !Sub
                      - 'arn:${AWS::Partition}:logs:${Region}:${AWS::AccountId}:log-group:API-Gateway-*'
                      - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                    - !If
                      - HasAccessLogGroupPrefix
                      - !Sub
                        - 'arn:${AWS::Partition}:logs:${Region}:${AWS::AccountId}:log-group:${AccessLogGroupPrefix}*'
                        - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                      - !Ref AWS::NoValue
                # Cross-account CloudWatch Logs destinations are never allowed.
                - Sid: NoLogDestinations
                  Effect: Deny
                  Action: logs:PutSubscriptionFilter
                  Resource: !Sub 'arn:${AWS::Partition}:logs:*:*:destination:*'
          - !Ref AWS::NoValue
        # Gateway Orchestration and push ingestion for a connection that has no access keys
        # (organization-service AwsApiGatewayProvisioningAdapter, AwsApiGatewayEnforcementAdapter,
        # AwsApiGatewayEventAdapter). Exactly the calls those adapters make, nothing more.
        # GET /usageplans, /usageplans/{id} and /restapis/{id} are already allowed by
        # ReadApiConfiguration.
        - !If
          - GatewayOrchestration
          - PolicyName: AforoGatewayOrchestration
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # CreateUsagePlan, CreateApiKey, CreateUsagePlanKey.
                - Sid: CreateUsagePlansAndKeys
                  Effect: Allow
                  Action: apigateway:POST
                  Resource:
                    - !Sub
                      - 'arn:${AWS::Partition}:apigateway:${Region}::/usageplans'
                      - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                    - !Sub
                      - 'arn:${AWS::Partition}:apigateway:${Region}::/usageplans/*/keys'
                      - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                    - !Sub
                      - 'arn:${AWS::Partition}:apigateway:${Region}::/apikeys'
                      - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                # UpdateUsagePlan (quota, throttle, stages, add/remove keys) and UpdateApiKey
                # (enable, disable, name).
                - Sid: UpdateUsagePlansAndKeys
                  Effect: Allow
                  Action: apigateway:PATCH
                  Resource:
                    - !Sub
                      - 'arn:${AWS::Partition}:apigateway:${Region}::/usageplans/*'
                      - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                    - !Sub
                      - 'arn:${AWS::Partition}:apigateway:${Region}::/apikeys/*'
                      - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                # DeleteUsagePlan, DeleteApiKey.
                - Sid: DeleteUsagePlansAndKeys
                  Effect: Allow
                  Action: apigateway:DELETE
                  Resource:
                    - !Sub
                      - 'arn:${AWS::Partition}:apigateway:${Region}::/usageplans/*'
                      - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                    - !Sub
                      - 'arn:${AWS::Partition}:apigateway:${Region}::/apikeys/*'
                      - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                # GetApiKey (enforcement status) and GetUsagePlanKeys (listKeys). Both return
                # key values; NeverReadApiKeys stops denying them under this opt-in.
                - Sid: ReadManagedApiKeys
                  Effect: Allow
                  Action: apigateway:GET
                  Resource:
                    - !Sub
                      - 'arn:${AWS::Partition}:apigateway:${Region}::/apikeys/*'
                      - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                    - !Sub
                      - 'arn:${AWS::Partition}:apigateway:${Region}::/usageplans/*/keys'
                      - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                # Pull ingestion reads AWS/ApiGateway metrics. GetMetricData has no
                # resource-level permissions.
                - Sid: ReadApiGatewayMetrics
                  Effect: Allow
                  Action: cloudwatch:GetMetricData
                  Resource: '*'
                # Push ingestion: one stream per connection, aforo-gateway-<id>.
                - Sid: ManageEventDeliveryStreams
                  Effect: Allow
                  Action:
                    - firehose:CreateDeliveryStream
                    - firehose:DescribeDeliveryStream
                    - firehose:UpdateDestination
                    - firehose:DeleteDeliveryStream
                  Resource: !Sub
                    - 'arn:${AWS::Partition}:firehose:${Region}:${AWS::AccountId}:deliverystream/aforo-gateway-*'
                    - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                # The subscription that feeds the stream, on API Gateway log groups only.
                - Sid: SubscribeEventStream
                  Effect: Allow
                  Action:
                    - logs:PutSubscriptionFilter
                    - logs:DeleteSubscriptionFilter
                  Resource:
                    - !Sub
                      - 'arn:${AWS::Partition}:logs:${Region}:${AWS::AccountId}:log-group:/aws/apigateway/*'
                      - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                    - !Sub
                      - 'arn:${AWS::Partition}:logs:${Region}:${AWS::AccountId}:log-group:API-Gateway-*'
                      - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                    - !If
                      - HasAccessLogGroupPrefix
                      - !Sub
                        - 'arn:${AWS::Partition}:logs:${Region}:${AWS::AccountId}:log-group:${AccessLogGroupPrefix}*'
                        - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                      - !Ref AWS::NoValue
                # The only role Aforo can hand to Firehose: the one created below, or yours.
                - !If
                  - PassFirehoseRole
                  - Sid: PassFirehoseRole
                    Effect: Allow
                    Action: iam:PassRole
                    Resource: !If [HasFirehoseRoleArn, !Ref FirehoseRoleArn, !GetAtt AforoFirehoseDeliveryRole.Arn]
                    Condition:
                      StringEquals:
                        iam:PassedToService: firehose.amazonaws.com
                  - !Ref AWS::NoValue
                # The only role Aforo can hand to CloudWatch Logs.
                - !If
                  - PassCloudWatchLogsRole
                  - Sid: PassCloudWatchLogsRole
                    Effect: Allow
                    Action: iam:PassRole
                    Resource: !If [HasCloudWatchLogsRoleArn, !Ref CloudWatchLogsRoleArn, !GetAtt AforoLogsToFirehoseRole.Arn]
                    Condition:
                      StringEquals:
                        iam:PassedToService: logs.amazonaws.com
                  - !Ref AWS::NoValue
          - !Ref AWS::NoValue

  # What the metering Lambda itself may do: write its own logs and read its Aforo API key
  # from the aforo/metering/* secrets. Nothing else.
  # The name is fixed by the external ID so Aforo can find the role without IAM read access.
  AforoMeteringExecutionRole:
    Type: AWS::IAM::Role
    Condition: MeteringInstall
    Properties:
      RoleName: !Sub 'aforo-metering-exec-${ExternalId}'
      Description: Execution role of Aforo's metering Lambda (writes its own logs, reads its Aforo API key secret).
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AforoMeteringLambdaLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub
                    - 'arn:${AWS::Partition}:logs:${Region}:${AWS::AccountId}:log-group:/aws/lambda/aforo-metering-*'
                    - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
                  - !Sub
                    - 'arn:${AWS::Partition}:logs:${Region}:${AWS::AccountId}:log-group:/aws/lambda/aforo-metering-*:*'
                    - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
        # The secret is encrypted with the AWS-managed aws/secretsmanager key, whose key
        # policy already lets principals in this account decrypt through Secrets Manager.
        - PolicyName: AforoMeteringApiKeySecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub
                  - 'arn:${AWS::Partition}:secretsmanager:${Region}:${AWS::AccountId}:secret:aforo/metering/*'
                  - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]

  # Push ingestion's two service roles, created when FirehoseBackupBucketArn is set with
  # AllowGatewayOrchestration = true. Neither can be assumed by Aforo.
  # Firehose assumes this one to write records it cannot deliver to the backup bucket.
  AforoFirehoseDeliveryRole:
    Type: AWS::IAM::Role
    Condition: CreateEventRoles
    Properties:
      Description: Assumed by Kinesis Data Firehose (aforo-gateway-* streams) to write undeliverable records to the backup bucket.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref AWS::AccountId
      Policies:
        - PolicyName: AforoFirehoseBackupBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !Ref FirehoseBackupBucketArn
                  - !Sub '${FirehoseBackupBucketArn}/*'

  # CloudWatch Logs assumes this one to put API Gateway log events into the stream.
  AforoLogsToFirehoseRole:
    Type: AWS::IAM::Role
    Condition: CreateEventRoles
    Properties:
      Description: Assumed by CloudWatch Logs in this account to put API Gateway log events into aforo-gateway-* Firehose streams.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: logs.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringLike:
                aws:SourceArn: !Sub
                  - 'arn:${AWS::Partition}:logs:${Region}:${AWS::AccountId}:*'
                  - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]
      Policies:
        - PolicyName: AforoPutToEventStream
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !Sub
                  - 'arn:${AWS::Partition}:firehose:${Region}:${AWS::AccountId}:deliverystream/aforo-gateway-*'
                  - Region: !If [UseStackRegion, !Ref 'AWS::Region', !Ref ApiGatewayRegion]

Outputs:
  AforoRoleArn:
    Description: Copy this value into Aforo and click Finish connecting.
    Value: !GetAtt AforoRole.Arn
  AforoMeteringExecutionRoleArn:
    Condition: MeteringInstall
    Description: Execution role of the metering Lambda. Aforo finds it by name; nothing to copy.
    Value: !GetAtt AforoMeteringExecutionRole.Arn
  FirehoseRoleArn:
    Condition: CreateEventRoles
    Description: Paste into the Aforo connection field firehoseRoleArn.
    Value: !GetAtt AforoFirehoseDeliveryRole.Arn
  CloudWatchLogsRoleArn:
    Condition: CreateEventRoles
    Description: Paste into the Aforo connection field cloudWatchLogsRoleArn.
    Value: !GetAtt AforoLogsToFirehoseRole.Arn
  FirehoseBackupBucketArn:
    Condition: CreateEventRoles
    Description: Paste into the Aforo connection field firehoseBackupBucketArn.
    Value: !Ref FirehoseBackupBucketArn
