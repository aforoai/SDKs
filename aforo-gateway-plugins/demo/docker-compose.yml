# Aforo metering demo: Nirmala's app -> Kong (+ aforo-metering) -> Suchith's API.
#
# Aforo's own services (usage-ingestor :8084, pricing :8083, postgres, redis) are
# NOT started here -- run them separately and this stack reaches them via
# host.docker.internal. See README.md "Prerequisites".
#
#   node scripts/generate-keys-and-config.js   # once, before first up
#   docker compose up --build

services:
  suchith-backend:
    build: ./suchith-backend
    container_name: demo-suchith-backend
    # No host port: reachable only through Kong, which is the point of the demo.
    # The X-Customer-Id header it trusts is only trustworthy because Kong sets it.
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  kong:
    # Built from ../kong so the image carries the plugin itself. Installing the
    # plugin into a running Kong container does not survive: changing KONG_PLUGINS
    # forces a container recreate, which discards the luarocks install, and the
    # new container dies during init before you can exec in to fix it.
    build:
      context: ../kong
      dockerfile: Dockerfile
    container_name: demo-kong
    depends_on:
      suchith-backend:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      # The Admin API has no authentication: anyone who reaches it can rewrite
      # every route and plugin, the aforo-metering api_key included. It listens
      # on the container's own loopback and is not published, so only a shell
      # inside the container reaches it (G369):
      #   docker compose exec kong curl -s http://127.0.0.1:8001/status
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      # handler.lua buffers events here. Without it the plugin loads, proxies
      # traffic, and silently meters nothing.
      KONG_NGINX_HTTP_LUA_SHARED_DICT: "aforo_buffer 10m"
      # Needed whenever aforo_endpoint is https. Kong's default of 1 is too
      # shallow for a normal certificate chain and every flush fails with
      # "unable to get local issuer certificate" -- which is a depth problem,
      # not a missing-CA problem. Also set in the plugin image; repeated here so
      # the requirement is visible to anyone reading only this file.
      KONG_LUA_SSL_VERIFY_DEPTH: "3"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    # Published on the host's loopback only: the demo is for this machine.
    # Override when 8000 is already taken:
    #   KONG_PROXY_PORT=8010 docker compose up
    ports:
      - "127.0.0.1:${KONG_PROXY_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nirmala-frontend:
    image: nginx:alpine
    container_name: demo-nirmala-frontend
    depends_on: [kong]
    volumes:
      - ./nirmala-frontend:/usr/share/nginx/html:ro
    # :3000 on purpose -- it is already in the ingestor's CORS_ALLOWED_ORIGINS,
    # so the budget panel can read /v1/budget/status without extra config.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
