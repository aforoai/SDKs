name: CI

# Builds and tests every artifact in this repo on each push / PR, so a broken
# build or malformed config never reaches a developer who clones a package.
# Mirrors the local verification matrix: Go / Node / Python / Java SDKs build +
# test; Kong (LuaJIT) and EMQX (Erlang) compile; every gateway config file is
# validated as well-formed XML / YAML / JSON.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Contract, mock ingestor, transport copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: contract JSON parses and the drift checker's own tests pass
        run: |
          node -e "JSON.parse(require('fs').readFileSync('aforo-metering-sdks/contract/ingest-contract.json','utf8'))"
          node --test aforo-metering-sdks/contract/verify-ingestor.test.mjs
      - name: mock ingestor tests
        working-directory: aforo-metering-sdks/mock-ingestor
        run: npm test
      - name: transport core copies match their cores
        working-directory: aforo-metering-sdks
        run: bash scripts/sync-transport.sh --check

  go:
    name: Go SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'   # mock-ingestor
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.11'  # runbook section 9: patched toolchain (GO-2026-6809 fixed in 1.26.10, GO-2026-6859 net/http in 1.26.11); 'stable' floated to 1.27, whose -race build trips go-graphql's allocation test
      - name: build + vet + test + govulncheck
        run: |
          set -e
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          for d in go go-graphql go-grpc go-ws go-mqtt; do
            echo "::group::$d"
            (cd "aforo-metering-sdks/$d" && go build ./... && go vet ./... && go test -race ./... && "$(go env GOPATH)/bin/govulncheck" ./...)
            echo "::endgroup::"
          done

  node:
    name: Node SDKs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [node, node-agent, node-mcp, mcp-proxy, node-graphql, node-grpc, node-ws, node-mqtt, mcp-test-server, agent-test-server]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: install (lockfile) + build + test + audit
        working-directory: aforo-metering-sdks/${{ matrix.pkg }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
          npm audit --omit=dev --audit-level=high

  python:
    name: Python SDKs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [python, python-agent, python-mcp, python-graphql, python-grpc, python-ws, python-mqtt]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'   # mock-ingestor
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: install + compile + test
        working-directory: aforo-metering-sdks/${{ matrix.pkg }}
        run: |
          python -m pip install --upgrade pip
          # Test frameworks the protocol SDKs exercise (superset; harmless if unused).
          pip install pytest pytest-asyncio fastapi flask django strawberry-graphql grpcio websockets paho-mqtt aiohttp httpx
          pip install -e .
          python -m compileall -q .
          python -m pytest -q -o asyncio_mode=auto

  java:
    name: Java SDKs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [java, java-graphql, java-grpc, java-ws, java-mqtt]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'   # mock-ingestor
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: compile + test
        working-directory: aforo-metering-sdks/${{ matrix.module }}
        run: mvn -B -ntp clean verify

  kong-lua:
    name: Kong plugin (LuaJIT parse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: parse-check every Lua file (Kong runs on LuaJIT)
        working-directory: aforo-gateway-plugins/kong
        run: |
          set -e
          shopt -s globstar nullglob
          for f in **/*.lua; do
            echo "luajit -b $f"
            luajit -b "$f" /dev/null
          done

  kong-busted:
    name: Kong plugin (busted, Lua 5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Lua 5.1, LuaRocks, busted, lua-cjson
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks openssl
          sudo luarocks --lua-version=5.1 install busted
          sudo luarocks --lua-version=5.1 install lua-cjson
      - name: busted spec/
        working-directory: aforo-gateway-plugins/kong
        run: busted spec/

  gateway-plugin-tests:
    name: Gateway plugins (AWS, Apigee, Azure, MuleSoft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ingest auth standard (X-API-Key, api.aforo.ai)
        working-directory: aforo-gateway-plugins
        run: node tests/ingest-auth-standard.test.cjs
      - name: AWS Lambda
        working-directory: aforo-gateway-plugins/aws-lambda
        run: npm test
      - name: Apigee
        working-directory: aforo-gateway-plugins
        run: node apigee/tests/unit-tests.cjs
      - name: Azure APIM (policy expressions against a mock context)
        working-directory: aforo-gateway-plugins
        run: node azure-apim/tests/policy.test.cjs
      - name: MuleSoft (structure)
        working-directory: aforo-gateway-plugins
        run: node mulesoft/tests/policy.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: MuleSoft (package the policy jar)
        working-directory: aforo-gateway-plugins/mulesoft/aforo-metering
        # ./mvnw pins Maven 3.9.16: mule-maven-plugin 4.10.1 fails on the runner's
        # Maven with NoSuchMethodError (DefaultMirrorSelector.add).
        run: ./mvnw -B -ntp clean package

  emqx-erlang:
    name: EMQX plugin (eunit + plugin package)
    runs-on: ubuntu-latest
    # rebar3 loads the emqx_plugrel plugin (which uses `maybe') for every
    # command, eunit included; OTP 26 needs the feature flag to load it.
    env:
      ERL_FLAGS: -enable-feature maybe_expr
    steps:
      - uses: actions/checkout@v4
      # OTP 26 = the oldest OTP of the EMQX versions the plugin supports
      # (EMQX 5.7/5.8); beams built on it load on 5.9+ (OTP 27) too.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '26'
          rebar3-version: '3.24'
      # The mock-ingestor suites start aforo-metering-sdks/mock-ingestor.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: rebar3 eunit
        working-directory: aforo-emqx-plugin
        env:
          AFORO_MOCK_INGESTOR: ${{ github.workspace }}/aforo-metering-sdks/mock-ingestor
        run: rebar3 eunit
      - name: rebar3 emqx_plugrel tar (checks priv/config.hocon against the Avro schema)
        working-directory: aforo-emqx-plugin
        run: rebar3 emqx_plugrel tar
      - name: package contains release.json, config and schema
        working-directory: aforo-emqx-plugin/_build/default/emqx_plugrel
        run: |
          set -euo pipefail
          VSN=$(sed -n 's/.*{vsn, "\([^"]*\)"}.*/\1/p' ../../../src/aforo_metering.app.src)
          PKG="aforo_metering-${VSN}"
          tar tzf "${PKG}.tar.gz" > files.txt
          for f in "${PKG}/release.json" "${PKG}/README.md" \
                   "${PKG}/${PKG}/priv/config.hocon" "${PKG}/${PKG}/priv/config_schema.avsc"; do
            grep -qx "$f" files.txt || { echo "::error::missing $f in ${PKG}.tar.gz"; exit 1; }
          done
          tar xzf "${PKG}.tar.gz" -O "${PKG}/release.json" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          assert r["name"] == "aforo_metering", r
          assert r["rel_vsn"] == sys.argv[1], r
          assert r["with_config_schema"] is True, r
          print("release.json OK:", r["rel_apps"])
          ' "$VSN"
      - uses: actions/upload-artifact@v4
        with:
          name: aforo-emqx-plugin-package
          path: aforo-emqx-plugin/_build/default/emqx_plugrel/aforo_metering-*.tar.gz
          if-no-files-found: error

  gateway-config:
    name: Gateway config validation (XML / YAML / JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: validate every XML / YAML / JSON under gateway plugins + IaC
        run: |
          python - <<'PY'
          import sys, glob, json, xml.dom.minidom, yaml
          fail = 0

          class Tolerant(yaml.SafeLoader):
              pass
          # CloudFormation / SAM intrinsic tags (!Ref, !GetAtt, ...) are valid YAML extensions.
          Tolerant.add_multi_constructor('!', lambda loader, suffix, node: None)

          roots = ['aforo-gateway-plugins/**', 'aforo-emqx-plugin/**']
          for pat in roots:
              for f in glob.glob(pat + '/*.xml', recursive=True) + glob.glob(pat, recursive=True):
                  pass

          def check(path, kind):
              global fail
              try:
                  if kind == 'xml':
                      xml.dom.minidom.parse(path)
                  elif kind == 'json':
                      json.load(open(path))
                  elif kind == 'yaml':
                      list(yaml.load_all(open(path), Loader=Tolerant))
                  print(f"OK   {path}")
              except Exception as e:
                  print(f"FAIL {path}: {e}")
                  fail += 1

          # Azure APIM policies are uploaded as format "rawxml": a C# policy
          # expression may hold unescaped quotes inside an attribute, which a
          # strict XML parser refuses. azure-apim/tests/policy.test.cjs checks
          # them with the expressions masked (gateway-plugin-tests job).
          RAWXML = 'aforo-gateway-plugins/azure-apim/'

          for base in ('aforo-gateway-plugins', 'aforo-emqx-plugin'):
              for path in glob.glob(f'{base}/**/*.xml', recursive=True):
                  if path.startswith(RAWXML) or '/target/' in path:
                      continue
                  check(path, 'xml')
              for path in glob.glob(f'{base}/**/*.json', recursive=True):
                  check(path, 'json')
              for path in glob.glob(f'{base}/**/*.yaml', recursive=True) + glob.glob(f'{base}/**/*.yml', recursive=True):
                  check(path, 'yaml')

          sys.exit(1 if fail else 0)
          PY

  # G032 (2026-11-21): dependency CVE scan (Trivy) + Semgrep SAST. Same steps, versions and gate
  # variables (TRIVY_GATE / SEMGREP_GATE) as aforo-nextgen-common frontend-security.yml @125e779,
  # copied in because this public repo cannot call a workflow in a private repo.
  security-dependencies:
    name: dependencies (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy 0.76.1 (checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trivy.tgz" https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy && rm "$RUNNER_TEMP/trivy.tgz"
      - name: Scan the lockfile
        env:
          LOCKFILE: '.'
          SEVERITY: ${{ vars.TRIVY_FAIL_SEVERITY || 'HIGH,CRITICAL' }}
          GATE: ${{ vars.TRIVY_GATE }}
        run: |
          TRIVY="$RUNNER_TEMP/trivy"
          if [ ! -e "$LOCKFILE" ]; then echo "::error::lockfile or directory $LOCKFILE not found"; exit 1; fi
          IGNORE=""
          if [ -f .trivyignore ]; then IGNORE="--ignorefile .trivyignore"; fi
          "$TRIVY" fs --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL "$LOCKFILE" | tee trivy-report.txt
          # shellcheck disable=SC2086
          if ! "$TRIVY" fs --quiet --scanners vuln --ignore-unfixed --severity "$SEVERITY" \
               $IGNORE --exit-code 1 "$LOCKFILE" > trivy-gate.txt; then
            { echo "### Unaccepted fixable $SEVERITY vulnerabilities in $LOCKFILE"; echo '```'; cat trivy-gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            if [ "$GATE" = enforce ]; then echo "::error::unaccepted fixable $SEVERITY vulnerabilities"; exit 1; fi
            echo "::warning::unaccepted fixable $SEVERITY vulnerabilities (TRIVY_GATE is not 'enforce')"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-dependencies-${{ github.sha }}
          path: trivy-report.txt
          if-no-files-found: ignore
          retention-days: 30

  security-sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: semgrep
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE: ${{ vars.SEMGREP_GATE }}
          CONFIGS: p/owasp-top-ten p/typescript p/javascript p/python p/java p/golang p/dockerfile
          EXCLUDES: ''
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          MODE=""
          if [ -n "$BASE_SHA" ]; then MODE="--error --baseline-commit $BASE_SHA"
          elif [ "$GATE" = enforce ]; then MODE="--error"; fi
          set -f  # exclude globs are passed to semgrep as-is, never expanded by the shell
          ARGS=""
          for c in $CONFIGS; do ARGS="$ARGS --config $c"; done
          for e in $EXCLUDES; do ARGS="$ARGS --exclude $e"; done
          # shellcheck disable=SC2086
          semgrep scan --metrics off $ARGS --severity ERROR $MODE

  ci-success:
    name: CI success
    # One stable check to require in branch protection — green only if every
    # blocking job above passed.
    if: always()
    needs: [contract, go, node, python, java, kong-lua, kong-busted, gateway-plugin-tests, gateway-config, emqx-erlang, security-dependencies, security-sast]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required CI job did not succeed ($r)."
              exit 1
            fi
          done
          echo "All required CI jobs passed."
