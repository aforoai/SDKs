name: Publish — PyPI

# Publishes one Python package to PyPI via Trusted Publishing (OIDC) — no API
# token stored anywhere — from a release tag on the public mirror.
#
# Run it from the tag: Actions → "Publish — PyPI" → "Use workflow from" = the
# tag (e.g. python-v2.0.0) → pick the package. The run refuses to publish unless
# the ref is a tag named <package>-v<version> and <version> equals the built
# distribution's version.
#
# Two jobs (wave 5, G315–G317):
#   build — no OIDC token: builds, tests the wheel (test tools are installed
#           here, so third-party test code never runs where a PyPI token can
#           be minted), pip-audit on the runtime dependencies only, SBOM.
#   publish — protected `pypi` environment (the Trusted Publisher is bound to
#           it), id-token: write; runs only pinned actions on the built files:
#           build-provenance attestation, then upload with PyPI attestations.
# Every action is pinned to a full commit SHA (the tag is in the comment).
#
# This file is maintained in jayaforo/aforo-metering-sdks and copied into the
# mirror's .github/workflows/ by the sync PR (PUBLISHING.md).

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options: [python, python-agent, python-mcp, python-graphql, python-grpc, python-ws, python-mqtt]

permissions:
  contents: read

jobs:
  build:
    # Packages are published only from the public mirror.
    if: github.repository == 'aforoai/SDKs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PKG_DIR: aforo-metering-sdks/${{ inputs.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'   # the test suites start mock-ingestor with node
      - name: Build sdist + wheel
        working-directory: ${{ env.PKG_DIR }}
        run: |
          python -m pip install build==1.6.1
          python -m build
      - name: Check the tag names this package and version
        working-directory: ${{ env.PKG_DIR }}
        env:
          PACKAGE: ${{ inputs.package }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name '*.whl' | head -1)
          version=$(basename "$wheel" | cut -d- -f2)
          expected="${PACKAGE}-v${version}"
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "$expected" ]; then
            echo "::error::Run this from the tag ${expected} (got ${REF_TYPE} ${REF_NAME})."
            exit 1
          fi
      - name: Transport core copies match
        run: bash aforo-metering-sdks/scripts/sync-transport.sh --check python
      - name: Test the built wheel
        working-directory: ${{ env.PKG_DIR }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          # Same test-framework superset as ci.yml (harmless where unused).
          pip install "$(find dist -maxdepth 1 -name '*.whl' | head -1)[dev]" pytest pytest-asyncio fastapi flask django strawberry-graphql grpcio websockets paho-mqtt aiohttp httpx
          python -m pytest -q -o asyncio_mode=auto
      - name: Vulnerability scan and SBOM
        working-directory: ${{ env.PKG_DIR }}
        run: |
          set -euo pipefail
          # Audit what a customer installs: the wheel and its runtime
          # dependencies only, in their own environment (not the test tools).
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/pip" install "$(find dist -maxdepth 1 -name '*.whl' | head -1)"
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install pip-audit==2.10.1 cyclonedx-bom==7.5.0
          # Audit the wheel's pinned runtime dependencies. Not --path on the whole
          # site-packages: with --strict that fails on our own not-yet-published
          # version ("not found on PyPI"), and it flags the venv's bootstrap
          # setuptools, which customers do not get from us. pip freeze omits
          # pip/setuptools/wheel by default; --exclude drops our own package.
          own=$(basename "$(find dist -maxdepth 1 -name '*.whl' | head -1)" | cut -d- -f1)
          "$RUNNER_TEMP/runtime/bin/pip" freeze --exclude "$own" > "$RUNNER_TEMP/runtime-deps.txt"
          cat "$RUNNER_TEMP/runtime-deps.txt"
          "$RUNNER_TEMP/tools/bin/pip-audit" --strict --progress-spinner off --no-deps --disable-pip -r "$RUNNER_TEMP/runtime-deps.txt"
          "$RUNNER_TEMP/tools/bin/cyclonedx-py" environment "$RUNNER_TEMP/runtime/bin/python" -o "$RUNNER_TEMP/sbom.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: ${{ env.PKG_DIR }}/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ inputs.package }}-${{ github.ref_name }}
          path: ${{ runner.temp }}/sbom.cdx.json

  publish:
    needs: build
    if: github.repository == 'aforoai/SDKs'
    runs-on: ubuntu-latest
    environment: pypi   # the Trusted Publisher is bound to this environment
    permissions:
      contents: read
      id-token: write   # PyPI Trusted Publishing and attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
