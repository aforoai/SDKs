name: Publish — Maven Central

# Uploads one Java module to the Maven Central Portal from a release tag on the
# public mirror. The poms set autoPublish=false, so the upload lands as a
# VALIDATED deployment that a person releases in the Central Portal UI after
# checking it — nothing reaches Central from this run alone.
#
# Run it from the tag: Actions → "Publish — Maven Central" → "Use workflow
# from" = the tag (e.g. java-v2.0.0) → pick the module. The run refuses to
# publish unless the ref is a tag named <module>-v<version> and <version>
# equals the pom's version.
#
# Guards (wave 5, G311, G315–G317): actions pinned to full SHAs; two jobs —
# `build` (no secrets: full test suite, OSV scan, CycloneDX SBOM) and
# `publish` (protected `maven` environment holding the signing and Portal
# secrets; runs only after `build` passed on the same commit, signs, uploads
# and attests the jars it uploads).
#
# One-time setup (DevOps): the `ai.aforo` namespace on central.sonatype.com
# (DNS TXT on aforo.ai), a GPG key on a keyserver, and secrets
# MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD (Portal token),
# MAVEN_GPG_PRIVATE_KEY (ASCII-armored) / MAVEN_GPG_PASSPHRASE, scoped to the
# `maven` environment.
#
# This file is maintained in jayaforo/aforo-metering-sdks and copied into the
# mirror's .github/workflows/ by the sync PR (PUBLISHING.md).

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Module to publish"
        required: true
        type: choice
        options: [java, java-graphql, java-grpc, java-ws, java-mqtt]

permissions:
  contents: read

jobs:
  build:
    # Packages are published only from the public mirror.
    if: github.repository == 'aforoai/SDKs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODULE_DIR: aforo-metering-sdks/${{ inputs.module }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'   # the test suites start mock-ingestor with node
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check the tag names this module and version
        working-directory: ${{ env.MODULE_DIR }}
        env:
          MODULE: ${{ inputs.module }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          expected="${MODULE}-v${version}"
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "$expected" ]; then
            echo "::error::Run this from the tag ${expected} (got ${REF_TYPE} ${REF_NAME})."
            exit 1
          fi
          case "$version" in *SNAPSHOT*) echo "::error::Refusing to publish a SNAPSHOT."; exit 1 ;; esac
      - name: Transport core copies match
        run: bash aforo-metering-sdks/scripts/sync-transport.sh --check java
      - name: Build and test (no skipped tests)
        working-directory: ${{ env.MODULE_DIR }}
        run: mvn -B -ntp clean verify
      - name: SBOM
        working-directory: ${{ env.MODULE_DIR }}
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DincludeTestScope=false -DoutputFormat=json -DoutputName=sbom.cdx
      - name: Vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --sbom=${{ env.MODULE_DIR }}/target/sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ inputs.module }}-${{ github.ref_name }}
          path: ${{ env.MODULE_DIR }}/target/sbom.cdx.json

  publish:
    needs: build
    if: github.repository == 'aforoai/SDKs'
    runs-on: ubuntu-latest
    environment: maven
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MODULE_DIR: aforo-metering-sdks/${{ inputs.module }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Sign and upload to the Central Portal (held for manual release)
        working-directory: ${{ env.MODULE_DIR }}
        # The full suite passed in `build` on this commit (needs: build); it is
        # not re-run here, where the signing key and Portal token are loaded.
        run: mvn -B -ntp -Prelease -DskipTests deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ env.MODULE_DIR }}/target/*.jar
