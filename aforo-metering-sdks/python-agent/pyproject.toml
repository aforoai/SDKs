[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aforo-agent-metering"
version = "0.3.2"
description = "Aforo AI Agent Metering SDK — instrument agent runs (sessions, steps, capability calls) for billing and analytics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Aforo", email = "engineering@aforo.ai" }]
keywords = [
    "aforo",
    "ai-agent",
    "agent",
    "metering",
    "billing",
    "langchain",
    "llamaindex",
    "crewai",
    "autogen",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
aiohttp = ["aiohttp>=3.8"]
httpx = ["httpx>=0.24"]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://github.com/aforoai/SDKs"
Repository = "https://github.com/aforoai/SDKs"
Documentation = "https://docs.aforo.ai"

[tool.setuptools.packages.find]
include = ["aforo_agent_metering*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
# PEP 561 marker: publishes our type hints to downstream MyPy/pyright.
aforo_agent_metering = ["py.typed"]
